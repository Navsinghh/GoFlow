name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowcraft_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowcraft_test
      COLLAB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowcraft_collab_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database flowcraft_collab_test'
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.COLLAB_TEST_DATABASE_URL }}
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
          COLLAB_SECRET: ci-only-collab-secret-at-least-32-characters

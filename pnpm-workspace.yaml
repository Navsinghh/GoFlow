packages:
  - "apps/*"
  - "packages/*"
# Install scripts allowed to run. esbuild (used by tsx and drizzle-kit) sets up its native binary.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.9"
  - "@turbo/darwin-arm64@2.11.9"
  - "@turbo/linux-64@2.11.9"
  - "@turbo/linux-arm64@2.11.9"
  - "@turbo/windows-64@2.11.9"
  - "@turbo/windows-arm64@2.11.9"
  - turbo@2.11.9
  - lucide-react@1.59.0
